default_install_hook_types: [pre-commit, pre-push, commit-msg, post-merge]
default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/sbOogway/git-hooks
    rev: v0.2.0
    hooks:
      - id: conventional-commit
      - id: prune-merged-branches

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.14.0
    hooks:
      - id: golangci-lint-config-verify
      - id: golangci-lint-fmt
      - id: golangci-lint-full

  - repo: local
    hooks:
      - id: go-mod-tidy
        name: go mod tidy
        language: golang
        entry: go mod tidy -diff
        files: ^go\.(mod|sum)$|\.go$
        pass_filenames: false
      - id: go-test
        name: go test
        language: golang
        entry: go test -race ./...
        types: [go]
        pass_filenames: false
        stages: [pre-push]
      - id: govulncheck
        name: govulncheck
        language: golang
        entry: govulncheck ./...
        additional_dependencies: [golang.org/x/vuln/cmd/govulncheck@v1.9.0]
        files: ^go\.(mod|sum)$|\.go$
        pass_filenames: false
        stages: [pre-push]
