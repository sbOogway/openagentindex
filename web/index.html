<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Agent Index</title>
  <link rel="icon" href="data:,">
  <script type="module" src="/src/search.js"></script>
</head>
<body>
  <!-- Agent data is untrusted: use x-text and attribute bindings only, never x-html. -->
  <main x-data="search" class="mx-auto max-w-4xl space-y-4 px-4 py-6">
    <header class="border-b pb-4">
      <a href="index.html" class="text-lg font-semibold">Open Agent Index</a>
    </header>

    <form class="flex gap-2" @submit.prevent="go(0)">
      <input class="input flex-1" type="search" x-model="q" placeholder="Search name, host or description" aria-label="Search text">
      <button class="btn" type="submit">Search</button>
    </form>

    <section class="flex flex-wrap items-center gap-2" aria-label="Filters">
      <select class="select w-auto" x-model="status" @change="go(0)" aria-label="Status">
        <option value="ok">Valid card</option>
        <option value="failed">No valid card</option>
        <option value="any">All hosts</option>
      </select>
      <select class="select w-auto" x-model="binding" @change="go(0)" aria-label="Binding">
        <option value="">Any binding</option>
        <option value="JSONRPC">JSON-RPC</option>
        <option value="HTTP+JSON">HTTP+JSON</option>
        <option value="GRPC">gRPC</option>
      </select>
      <select class="select w-auto" x-model="version" @change="go(0)" aria-label="Protocol version">
        <option value="">Any version</option>
        <option value="1.0">v1.0</option>
        <option value="0.3">v0.3</option>
      </select>
      <form class="flex-1" @submit.prevent="addTag()">
        <input class="input min-w-40" list="tag-suggestions" x-model="tagInput"
               @input.debounce.200ms="suggest()" placeholder="Add tag, then Enter" aria-label="Add tag">
        <datalist id="tag-suggestions">
          <template x-for="s in suggestions" :key="s.tag">
            <option :value="s.tag" x-text="s.hosts === 1 ? '1 agent' : s.hosts + ' agents'"></option>
          </template>
        </datalist>
      </form>
      <button class="btn" data-variant="ghost" type="button" x-show="filtered" x-cloak @click="clearFilters()">Clear</button>
    </section>

    <div class="flex flex-wrap items-center gap-1" x-show="tags.length" x-cloak>
      <span class="text-muted-foreground text-sm">Tags:</span>
      <template x-for="t in tags" :key="t">
        <button class="badge" type="button" @click="removeTag(t)" :aria-label="'Remove tag ' + t">
          <span x-text="t"></span> ×
        </button>
      </template>
    </div>

    <div class="flex flex-wrap items-center gap-1" x-show="popular.length && !tags.length" x-cloak>
      <span class="text-muted-foreground text-sm">Popular:</span>
      <template x-for="p in popular" :key="p.tag">
        <button class="badge" data-variant="outline" type="button" @click="addTag(p.tag)" x-text="p.tag"></button>
      </template>
    </div>

    <div class="alert" data-variant="destructive" x-show="error" x-cloak>
      <h2 x-text="error"></h2>
    </div>
    <p class="text-muted-foreground text-sm" x-show="!error" x-text="summary"></p>

    <ul class="space-y-2">
      <template x-for="r in results" :key="r.host">
        <li class="card gap-2 py-4">
          <header>
            <h2 class="flex flex-wrap items-baseline gap-x-2">
              <a class="underline-offset-4 hover:underline" :href="agentURL(r.host)" x-text="r.name || r.host"></a>
              <span class="text-muted-foreground text-sm font-normal" x-show="r.name" x-text="r.host"></span>
            </h2>
            <p class="truncate" x-text="r.description || r.error"></p>
          </header>
          <footer class="flex-wrap gap-1 text-sm">
            <span class="badge" :data-variant="r.status === 'ok' ? 'secondary' : 'destructive'" x-text="r.status"></span>
            <span class="text-muted-foreground" x-show="r.protocol_version" x-text="'v' + r.protocol_version"></span>
            <template x-for="t in (r.tags || []).slice(0, 8)" :key="t">
              <a class="badge" data-variant="outline" :href="tagURL(t)" @click.prevent="addTag(t)" x-text="t"></a>
            </template>
            <span class="text-muted-foreground" x-show="(r.tags || []).length > 8" x-text="'+' + ((r.tags || []).length - 8)"></span>
          </footer>
        </li>
      </template>
    </ul>

    <nav class="flex justify-between" x-show="!error && total > 0" x-cloak>
      <button class="btn" data-variant="outline" type="button" :disabled="offset === 0" @click="prev()">Previous</button>
      <button class="btn" data-variant="outline" type="button" :disabled="last >= total" @click="next()">Next</button>
    </nav>
  </main>
</body>
</html>
