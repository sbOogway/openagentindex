<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent · Open Agent Index</title>
  <link rel="icon" href="data:,">
  <script type="module" src="/src/agent.js"></script>
</head>
<body>
  <!-- Agent data and agent replies are untrusted: use x-text and attribute bindings only, never x-html. -->
  <main x-data="agent" class="mx-auto max-w-4xl space-y-6 px-4 py-6">
    <header class="border-b pb-4">
      <a href="index.html" class="text-lg font-semibold">Open Agent Index</a>
    </header>

    <div class="alert" data-variant="destructive" x-show="error" x-cloak>
      <h2 x-text="error"></h2>
    </div>

    <template x-if="agent">
      <article class="space-y-6">
        <section class="space-y-2">
          <h1 class="text-3xl font-semibold" x-text="agent.name || agent.host"></h1>
          <p class="text-muted-foreground flex flex-wrap items-center gap-2 text-sm">
            <a class="underline-offset-4 hover:underline" :href="cardURL" rel="noopener noreferrer" x-text="agent.host"></a>
            <span class="badge" :data-variant="agent.status === 'ok' ? 'secondary' : 'destructive'" x-text="agent.status"></span>
            <span x-show="agent.protocol_version" x-text="'v' + agent.protocol_version"></span>
          </p>
          <p x-text="agent.description"></p>
        </section>

        <section class="card">
          <header><h2>Skills</h2></header>
          <section>
            <p class="text-muted-foreground text-sm" x-show="skills.length === 0">No skills.</p>
            <ul class="space-y-3">
              <template x-for="s in skills" :key="s.id || s.name">
                <li>
                  <strong x-text="s.name || s.id"></strong>
                  <span x-text="s.description"></span>
                  <div class="mt-1 flex flex-wrap gap-1" x-show="Array.isArray(s.tags) && s.tags.length">
                    <template x-for="tag in s.tags">
                      <span class="badge" data-variant="outline" x-text="tag"></span>
                    </template>
                  </div>
                </li>
              </template>
            </ul>
          </section>
        </section>

        <section class="card">
          <header>
            <h2>Chat</h2>
            <p>Your browser sends the messages directly to the agent. Open Agent Index does not see them. Some agents charge for requests or need a key.</p>
          </header>
          <section class="space-y-3">
            <p class="text-muted-foreground text-sm" x-show="chatUnavailable" x-text="chatUnavailable"></p>
            <div x-ref="log" class="flex max-h-96 flex-col gap-2 overflow-y-auto" aria-live="polite">
              <template x-for="(m, i) in messages" :key="i">
                <div class="max-w-[80%] rounded-md px-3 py-2 break-words whitespace-pre-wrap"
                     :class="{
                       'self-end bg-primary text-primary-foreground': m.who === 'user',
                       'self-start bg-muted': m.who === 'agent',
                       'self-start text-destructive': m.who === 'error',
                     }"
                     x-text="m.text"></div>
              </template>
            </div>
            <form class="flex gap-2" x-show="!chatUnavailable" @submit.prevent="sendMessage()">
              <input x-ref="input" class="input flex-1" x-model="text" placeholder="Message" aria-label="Message" autocomplete="off">
              <button class="btn" type="submit" :disabled="sending">Send</button>
            </form>
          </section>
        </section>

        <section class="card">
          <header><h2>Checks</h2></header>
          <section>
            <div class="table-container">
              <table class="table">
                <thead>
                  <tr><th>Time</th><th>Kind</th><th>Result</th><th>HTTP</th><th>Latency</th><th>Error</th></tr>
                </thead>
                <tbody>
                  <template x-for="o in agent.observations" :key="o.id">
                    <tr>
                      <td x-text="time(o.at)"></td>
                      <td x-text="o.kind"></td>
                      <td><span class="badge" :data-variant="o.ok ? 'secondary' : 'destructive'" x-text="o.ok ? 'ok' : 'failed'"></span></td>
                      <td x-text="o.http_status || ''"></td>
                      <td x-text="o.latency_ms + ' ms'"></td>
                      <td class="whitespace-normal" x-text="o.error || ''"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </section>
        </section>

        <section class="card">
          <header><h2>Agent card</h2></header>
          <section>
            <pre class="bg-muted overflow-x-auto rounded-md p-4 text-xs break-words whitespace-pre-wrap" x-text="cardJSON"></pre>
          </section>
        </section>
      </article>
    </template>
  </main>
</body>
</html>
